version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: eventsphere-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newpass123}
      POSTGRES_DB: ${DB_NAME:-eventsphere}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - eventsphere-network

  backend:
    build: ./backend
    container_name: eventsphere-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    expose:
      - "8000"
    networks:
      - eventsphere-network

  nginx:
    build: ./frontend
    container_name: eventsphere-nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - eventsphere-network

networks:
  eventsphere-network:
    driver: bridge

volumes:
  postgres_data:


